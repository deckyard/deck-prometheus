# Grimoire book configuration for the @jennifer/prometheus documentation.

[book]
title = "@jennifer/prometheus"
description = "Prometheus metrics: counters, gauges, histograms and summaries in the text exposition format, and queries against the Prometheus HTTP API"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://jennifer-language.github.io/deck-prometheus/"
repoUrl = "https://github.com/jennifer-language/deck-prometheus"
repoLabel = "Source"
editUrl = "https://github.com/jennifer-language/deck-prometheus/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
